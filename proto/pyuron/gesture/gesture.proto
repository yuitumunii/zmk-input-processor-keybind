syntax = "proto3";

package pyuron.gesture;

// Which runtime-tunable parameter of a zip_keybind processor to change.
// Values MUST stay in sync with enum zip_keybind_param in
// include/zmk/pointing/zip_keybind.h.
enum Param {
    PARAM_TICK = 0;          // flick size needed to fire (sensitivity)
    PARAM_WAIT_MS = 1;       // cooldown after a fire
    PARAM_TAP_MS = 2;        // press/repeat cadence
    PARAM_THRESHOLD = 3;     // ignore movements smaller than this
    PARAM_MAX_THRESHOLD = 4; // ignore movements larger than this
}

// Snapshot of one zip_keybind processor instance.
message GestureInfo {
    uint32 id = 1;            // index into the firmware's processor array
    string name = 2;         // devicetree node name, e.g. "zip_keybind_2finger"
    uint32 tick = 3;
    uint32 wait_ms = 4;
    uint32 tap_ms = 5;
    int32 threshold = 6;
    int32 max_threshold = 7;
}

// Each response carries at most ONE GestureInfo so it stays well under the
// Studio RPC TX buffer. The app probes get_count then get(0..count-1) rather
// than receiving a list, avoiding async notifications entirely.

message GetCountRequest {}
message GetCountResponse { uint32 count = 1; }

message GetGestureRequest { uint32 id = 1; }
message GetGestureResponse { GestureInfo gesture = 1; }

message SetParamRequest {
    uint32 id = 1;
    Param param = 2;
    int32 value = 3;
}
message SetParamResponse { GestureInfo gesture = 1; } // echoes applied state

message ResetGestureRequest { uint32 id = 1; } // restore devicetree defaults
message ResetGestureResponse { GestureInfo gesture = 1; }

// 1方向のbinding。behavior_id は ZMK Studio の behavior local id
// (= crc16 of behavior device name)。標準キーマップRPCと同じidなので
// アプリ側は既存の挙動ピッカーをそのまま流用できる。
message BindingInfo {
    uint32 id = 1;          // gesture instance id
    uint32 dir = 2;         // 0=right 1=left 2=down 3=up
    uint32 behavior_id = 3; // zmk_behavior_local_id_t
    int32 param1 = 4;
    int32 param2 = 5;
}
message GetBindingRequest { uint32 id = 1; uint32 dir = 2; }
message GetBindingResponse { BindingInfo binding = 1; }
message SetBindingRequest {
    uint32 id = 1;
    uint32 dir = 2;
    uint32 behavior_id = 3;
    int32 param1 = 4;
    int32 param2 = 5;
}
message SetBindingResponse { BindingInfo binding = 1; }

message Request {
    oneof request_type {
        GetCountRequest get_count = 1;
        GetGestureRequest get = 2;
        SetParamRequest set_param = 3;
        ResetGestureRequest reset = 4;
        GetBindingRequest get_binding = 5;
        SetBindingRequest set_binding = 6;
        // Dynamic layer-gesture RPC (tags 7-12)
        GetLayerBindingRequest get_layer_binding = 7;
        SetLayerBindingRequest set_layer_binding = 8;
        EnableLayerRequest enable_layer = 9;
        DisableLayerRequest disable_layer = 10;
        GetLayerCountRequest get_layer_count = 11;
        GetConfiguredLayerRequest get_configured_layer = 12;
        // Per-(layer,direction) sensitivity RPC (tags 13-15)
        GetLayerSensRequest get_layer_sens = 13;
        SetLayerSensRequest set_layer_sens = 14;
        ResetLayerSensRequest reset_layer_sens = 15;
    }
}

message ErrorResponse { string message = 1; }

message Response {
    oneof response_type {
        ErrorResponse error = 1;
        GetCountResponse get_count = 2;
        GetGestureResponse get = 3;
        SetParamResponse set_param = 4;
        ResetGestureResponse reset = 5;
        GetBindingResponse get_binding = 6;
        SetBindingResponse set_binding = 7;
        // Dynamic layer-gesture RPC (tags 8-13)
        GetLayerBindingResponse get_layer_binding = 8;
        SetLayerBindingResponse set_layer_binding = 9;
        EnableLayerResponse enable_layer = 10;
        DisableLayerResponse disable_layer = 11;
        GetLayerCountResponse get_layer_count = 12;
        GetConfiguredLayerResponse get_configured_layer = 13;
        // Per-(layer,direction) sensitivity RPC (tags 14-16)
        GetLayerSensResponse get_layer_sens = 14;
        SetLayerSensResponse set_layer_sens = 15;
        ResetLayerSensResponse reset_layer_sens = 16;
    }
}

// -----------------------------------------------------------------------
// Dynamic layer-gesture messages
// -----------------------------------------------------------------------

// Snapshot of one layer/direction binding (+ enabled flag for the layer).
message LayerBindingInfo {
    uint32 layer = 1;
    uint32 dir = 2;       // 0=right 1=left 2=down 3=up
    uint32 behavior_id = 3;
    int32 param1 = 4;
    int32 param2 = 5;
    bool enabled = 6;     // whether the layer entry is enabled
}

message GetLayerBindingRequest  { uint32 layer = 1; uint32 dir = 2; }
message GetLayerBindingResponse { LayerBindingInfo binding = 1; }

message SetLayerBindingRequest {
    uint32 layer = 1;
    uint32 dir = 2;
    uint32 behavior_id = 3;
    int32 param1 = 4;
    int32 param2 = 5;
}
message SetLayerBindingResponse { LayerBindingInfo binding = 1; }

message EnableLayerRequest  { uint32 layer = 1; }
message EnableLayerResponse { uint32 layer = 1; bool enabled = 2; }

message DisableLayerRequest  { uint32 layer = 1; }
message DisableLayerResponse { uint32 layer = 1; bool enabled = 2; }

message GetLayerCountRequest  {}
message GetLayerCountResponse { uint32 count = 1; }

message GetConfiguredLayerRequest  { uint32 index = 1; }
message GetConfiguredLayerResponse { uint32 layer = 1; bool enabled = 2; }

// -----------------------------------------------------------------------
// Per-(layer, direction) sensitivity messages
// Only TICK / WAIT_MS / THRESHOLD are per-direction (see enum Param).
// -----------------------------------------------------------------------

message LayerSensInfo {
    uint32 layer = 1;
    uint32 dir = 2;          // 0=right 1=left 2=down 3=up
    uint32 tick = 3;
    uint32 wait_ms = 4;
    int32 threshold = 5;
}

message GetLayerSensRequest  { uint32 layer = 1; uint32 dir = 2; }
message GetLayerSensResponse { LayerSensInfo sens = 1; }

message SetLayerSensRequest {
    uint32 layer = 1;
    uint32 dir = 2;
    Param param = 3;          // TICK / WAIT_MS / THRESHOLD only
    int32 value = 4;
}
message SetLayerSensResponse { LayerSensInfo sens = 1; }

message ResetLayerSensRequest  { uint32 layer = 1; uint32 dir = 2; }
message ResetLayerSensResponse { LayerSensInfo sens = 1; }
